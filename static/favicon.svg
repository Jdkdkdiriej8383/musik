<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .bg { fill: #0f1218; rx: 32px; stroke: rgba(30, 215, 96, 0.4); stroke-width: 1.5; }
      .bar {
        fill: #1ed760;
        filter: url(#neon-glow);
        transform-box: fill-box;
        transform-origin: bottom center;
      }
      .b1 { animation: b1-bounce 1.1s infinite ease-in-out alternate; }
      .b2 { animation: b2-bounce 1.4s infinite ease-in-out alternate; }
      .b3 { animation: b3-bounce 1.2s infinite ease-in-out alternate; }
      .b4 { animation: b4-bounce 1.3s infinite ease-in-out alternate; }

      @keyframes b1-bounce {
        0% { transform: scaleY(0.4); }
        100% { transform: scaleY(1.3); }
      }
      @keyframes b2-bounce {
        0% { transform: scaleY(0.7); }
        100% { transform: scaleY(1.0); }
      }
      @keyframes b3-bounce {
        0% { transform: scaleY(0.4); }
        100% { transform: scaleY(1.35); }
      }
      @keyframes b4-bounce {
        0% { transform: scaleY(0.55); }
        100% { transform: scaleY(1.15); }
      }
    </style>
  </defs>
  <rect class="bg" width="64" height="64" />
  <g class="bars">
    <rect class="bar b1" x="14" y="38" width="6" height="10" rx="3" />
    <rect class="bar b2" x="24" y="14" width="6" height="34" rx="3" />
    <rect class="bar b3" x="34" y="28" width="6" height="20" rx="3" />
    <rect class="bar b4" x="44" y="20" width="6" height="28" rx="3" />
  </g>
</svg>
