<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .bg { fill: #0c0e12; rx: 16px; }
      .bar {
        fill: #1ed760;
        filter: url(#neon-glow);
        transform-box: fill-box;
        transform-origin: bottom center;
      }
      .b1 { animation: b1-bounce 1.0s infinite ease-in-out alternate; }
      .b2 { animation: b2-bounce 1.3s infinite ease-in-out alternate; }
      .b3 { animation: b3-bounce 1.1s infinite ease-in-out alternate; }
      .b4 { animation: b4-bounce 1.2s infinite ease-in-out alternate; }

      @keyframes b1-bounce {
        0% { transform: scaleY(0.4); }
        100% { transform: scaleY(1.3); }
      }
      @keyframes b2-bounce {
        0% { transform: scaleY(0.65); }
        100% { transform: scaleY(1.0); }
      }
      @keyframes b3-bounce {
        0% { transform: scaleY(0.35); }
        100% { transform: scaleY(1.4); }
      }
      @keyframes b4-bounce {
        0% { transform: scaleY(0.5); }
        100% { transform: scaleY(1.15); }
      }
    </style>
  </defs>
  <rect class="bg" width="64" height="64" />
  <g class="bars">
    <rect class="bar b1" x="14" y="36" width="6" height="10" rx="3" />
    <rect class="bar b2" x="24" y="16" width="6" height="30" rx="3" />
    <rect class="bar b3" x="34" y="30" width="6" height="16" rx="3" />
    <rect class="bar b4" x="44" y="22" width="6" height="24" rx="3" />
  </g>
</svg>
